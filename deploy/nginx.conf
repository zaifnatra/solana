worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    # Only Caddy's exact private address can supply the client identity.
    set_real_ip_from 172.30.251.10;
    real_ip_header X-MTL-Client-IP;
    real_ip_recursive off;
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=signup:1m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=connections:1m;
    limit_req_status 429;
    limit_conn_status 429;
    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    # Resolve the container name again after application image upgrades.
    resolver 127.0.0.11 valid=10s ipv6=off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_set_header Host $host;
    # Application receives no caller-controlled proxy identity headers.
    proxy_set_header X-MTL-Client-IP "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_set_header Authorization $http_authorization;
    log_format main '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';
    access_log /dev/stdout main;
    server {
        listen 8080;
        set $mtl_upstream http://mtl:8080;
        limit_conn connections 30;
        location = /metrics {
            # Metrics are available only through docker exec / private monitoring.
            return 404;
        }
        location = /api/v1/sessions {
            limit_req zone=signup burst=5 nodelay;
            proxy_pass $mtl_upstream;
        }
        location /api/ {
            limit_req zone=api burst=30 nodelay;
            proxy_pass $mtl_upstream;
        }
        location / {
            proxy_pass $mtl_upstream;
        }
    }
}
