name: Container image

on:
  pull_request:
    paths:
      - 'service/**'
      - 'web/**'
      - 'engine/programs/sol_proj/src/curve.rs'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/container-image.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the tested image to GHCR (otherwise build only)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Image name
        id: name
        shell: bash
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
      - name: Verify Rust
        run: docker build --target rust-build -t mtl-rust-build .
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify application before publication
        run: |
          docker compose up --build -d --wait
          curl --fail http://127.0.0.1:8080/readyz
          cd web
          npm ci
          npm run lint
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Verify recovery
        run: |
          ./deploy/backup.sh /tmp/mtl-image-backups
          ./deploy/restore-check.sh /tmp/mtl-image-backups/*.tgz
      - name: Application logs
        if: failure()
        run: docker compose logs
      - name: Stop test application
        if: always()
        run: docker compose down
      - name: Log in to GHCR
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image and attestations
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=mtl-runtime
          cache-to: type=gha,mode=max,scope=mtl-runtime
          provenance: mode=max
          sbom: true
      - name: Record immutable image reference
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo 'Deploy this immutable image reference:' >> "$GITHUB_STEP_SUMMARY"
          echo "\`$IMAGE@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
