name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: service
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate deployment artifacts
        run: |
          docker compose config --quiet
          docker compose -f compose.dev.yaml config --quiet
          MTL_IMAGE=mtl:ci MTL_DOMAIN=example.test ACME_EMAIL=test@example.test docker compose -f compose.production.yaml config --quiet
          for script in deploy/*.sh; do sh -n "$script"; done
          python3 -m unittest discover -s deploy -p 'test_*.py'
      - run: docker compose up --build -d --wait
      - name: Verify service and frontend
        run: |
          curl --fail http://127.0.0.1:8080/readyz
          curl --fail http://127.0.0.1:8080/api/v1/markets
          curl --fail http://127.0.0.1:8080/ | grep 'id="root"'
      - name: Browser trading and social flow
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Verify backup and restored service
        run: |
          ./deploy/backup.sh /tmp/mtl-backups
          ./deploy/restore-check.sh /tmp/mtl-backups/*.tgz
      - name: Validate proxy configurations
        run: |
          docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" -e MTL_DOMAIN=example.test -e ACME_EMAIL=test@example.test caddy:2.11-alpine caddy validate --config /etc/caddy/Caddyfile
          docker run --rm --user 101:101 --read-only --cap-drop ALL --tmpfs /tmp:size=16m,noexec,nosuid \
            --add-host mtl:127.0.0.1 -v "$PWD/deploy/nginx.conf:/etc/nginx/nginx.conf:ro" \
            --entrypoint nginx nginx:1.28-alpine -t
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  engine:
    runs-on: ubuntu-latest
    env:
      SOLANA_VERSION: v2.3.13
      ANCHOR_VERSION: 0.32.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: staging/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      # rustup on the runner reads engine/rust-toolchain.toml and installs the pinned version.
      - name: Curve unit tests
        working-directory: engine
        run: cargo test

      - name: Install Solana CLI and Anchor
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/$SOLANA_VERSION/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          mkdir -p "$HOME/.local/bin"
          curl -sSfL -o "$HOME/.local/bin/anchor" \
            "https://github.com/solana-foundation/anchor/releases/download/v$ANCHOR_VERSION/anchor-$ANCHOR_VERSION-x86_64-unknown-linux-gnu"
          chmod +x "$HOME/.local/bin/anchor"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install staging
        working-directory: staging
        run: npm ci

      # Builds the program, starts a fresh validator, runs a seeded scenario, checks solvency.
      - name: End-to-end scenario
        working-directory: staging
        run: npm run e2e -- --trades 100

      - name: Build staging UI
        working-directory: staging
        run: npm run build

      - name: Validator log
        if: failure()
        run: tail -n 100 engine/.anchor/validator.log || true
